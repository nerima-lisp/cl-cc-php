site_name: cl-cc-php
site_description: "CL-CC PHP frontend: lexer, parser, and grammar"
site_url: https://nerima-lisp.github.io/cl-cc-php/
repo_url: https://github.com/nerima-lisp/cl-cc-php
repo_name: nerima-lisp/cl-cc-php
edit_uri: edit/main/docs/src/

docs_dir: src
site_dir: ../site
use_directory_urls: true

copyright: Copyright &copy; cl-cc-php contributors — MIT License

# Promote broken links and pages missing from `nav` to build failures. The
# `--strict` flag in flake.nix says the same thing; setting it here means a
# local `mkdocs serve` behaves like CI instead of only failing in the sandbox.
strict: true

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nerima-lisp/cl-cc-php
      name: cl-cc-php on GitHub
  generator: false

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.smartsymbols
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      title: On this page

# Every page under docs/src/ must appear here: --strict fails the build on an
# unlisted page. That is deliberate, so the nav cannot silently fall behind.
nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - Quick Start: quick-start.md
  - Guide:
      - Core Concepts: core-concepts.md
      - Recipes: recipes.md
  - Reference:
      - API Reference: api-reference.md
      - Compatibility: compatibility.md
  - Architecture: architecture.md
  - Project:
      - Development: development.md

not_in_nav: |
  notes/
